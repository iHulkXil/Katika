services:
  - type: web
    name: katika-bet
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: VITE_PRIVY_APP_ID
        sync: false
      - key: VITE_SEPOLIA_CHIP
        sync: false
      - key: VITE_SEPOLIA_VAULT
        sync: false
